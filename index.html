<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Páramo Literario · Frase aleatoria</title>
  <meta name="description" content="Cada vez que abras esta página te mostrará una frase literaria aleatoria." />
  <script>
    try {
      const params = new URLSearchParams(window.location.search);
      const isNfcExperience = params.get('origen') === 'nfc' || params.get('modo') === 'nfc';
      if (isNfcExperience) {
        document.documentElement.classList.add('nfc-experience');
      } else if (sessionStorage.getItem('paramo-loader-seen')) {
        document.documentElement.classList.add('app-loader-returning');
      }
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=42" />
</head>
<body class="app-loading" data-mode="day">
  <div
    class="scene-background"
    id="scene-background"
    data-active-scene="day"
    aria-hidden="true"
  >
    <div
      class="scene-background__layer is-visible"
      data-scene-layer="0"
      data-scene-id="day"
    ></div>
    <div
      class="scene-background__layer"
      data-scene-layer="1"
      data-scene-id=""
    ></div>
  </div>
  <div class="app-loader" id="app-loader" aria-hidden="true">
    <div class="app-loader__panel">
      <span class="app-loader__mark">¿</span>
      <span class="app-loader__nfc-copy">La frase te encontró</span>
    </div>
  </div>
  <div class="quote-original-controls">
    <span class="quote-original-label sr-only" id="quote-original-label" hidden></span>
    <button
      type="button"
      class="quote-original-toggle"
      id="quote-original-toggle"
      aria-pressed="false"
      aria-label="Ver texto original"
      aria-controls="quote"
      hidden
    >
      <span class="quote-original-toggle__option quote-original-toggle__option--translation" data-quote-view="translation" aria-hidden="true">T</span>
      <span class="quote-original-toggle__option quote-original-toggle__option--original" data-quote-view="original" aria-hidden="true">O</span>
    </button>
  </div>
  <main class="wrap">
    <section
      class="quote-flow"
      id="quote-panel"
      aria-live="polite"
    >
      <div id="quote-card">
        <div class="quote-card__header">
          <h1 id="quote-card-title">Páramo Literario</h1>
          <div class="quote-rule quote-rule--top" aria-hidden="true"><span></span></div>
          <p class="quote-highlight" id="quote-highlight" hidden></p>
        </div>
        <div class="quote-card__body">
          <blockquote class="quote-text" id="quote">…</blockquote>
        </div>
        <div class="quote-card__footer">
          <div class="quote-rule quote-rule--short" aria-hidden="true"><span></span></div>
          <div class="author" id="author" aria-live="polite">
            <div class="author-line">
              <span class="meta-prefix" aria-hidden="true">—</span>
              <button
                type="button"
                class="meta-link literary-info-link meta-author"
                id="author-name"
                data-author-id=""
                aria-haspopup="dialog"
                aria-controls="author-modal"
              ></button>
            </div>
            <button
              type="button"
              class="meta-link literary-info-link meta-work"
              id="author-work"
              data-work-id=""
              aria-haspopup="dialog"
              aria-controls="work-modal"
            ></button>
          </div>
          <div class="watermark" aria-hidden="true">paramoliterario.com</div>
        </div>
      </div>
      <p class="tiny" id="share-feedback" hidden aria-live="polite"></p>
      <p class="tiny" id="quote-message" hidden aria-live="polite"></p>
    </section>
  </main>

  <button
    id="listen-voice-btn"
    type="button"
    class="floating-action floating-action--voice"
    aria-label="Escuchar fragmento"
    aria-pressed="false"
    title="Escuchar fragmento"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
    </svg>
    <span class="sr-only">Escuchar voz</span>
  </button>

  <button
    id="share-image-btn"
    type="button"
    class="floating-action floating-action--share"
    aria-label="Compartir fragmento"
    title="Compartir fragmento"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <path d="M8.59 13.51 15.42 17.49"></path>
      <path d="M15.41 6.51 8.59 10.49"></path>
    </svg>
  </button>

  <div
    class="modal is-hidden"
    id="author-modal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="author-modal-title"
  >
    <div class="modal__overlay" data-modal-dismiss="author"></div>
    <div class="modal__dialog" tabindex="-1">
      <button class="modal__close" type="button" aria-label="Cerrar">×</button>
      <div class="modal__header">
        <h2 class="modal__title" id="author-modal-title"></h2>
      </div>
      <div class="modal__body modal__content">
        <div class="author-content" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div
    class="modal is-hidden"
    id="work-modal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="work-modal-title"
  >
    <div class="modal__overlay" data-modal-dismiss="work"></div>
    <div class="modal__dialog" tabindex="-1">
      <button class="modal__close" type="button" aria-label="Cerrar">×</button>
      <div class="modal__header">
        <h2 class="modal__title" id="work-modal-title"></h2>
      </div>
      <div class="modal__body modal__content">
        <div class="work-content" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <script type="module" src="script.js?v=44"></script>
</body>
</html>
